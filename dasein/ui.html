<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dasein</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap">
<style>
:root{--ink:#141414;--mute:#8d8d89;--hair:#e4e4e0;--paper:#fff;--mono:ui-monospace,"SF Mono",Menlo,monospace;--e:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Satoshi","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:920px;margin:0 auto;padding:28px 24px 18vh}
.mono{font-family:var(--mono);font-size:12px;line-height:1.5;font-weight:400}
.mute{color:var(--mute)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.mark{display:flex;align-items:center;gap:7px;font-weight:500;font-size:16px}
.o{display:inline-block;width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%}
.up{animation:up 1s var(--e) both}
@keyframes up{from{opacity:0;filter:blur(8px);transform:translateY(14px)}to{opacity:1;filter:none;transform:none}}
figure{margin:0 0 17vh}
.plate{position:relative;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
canvas{display:block;width:100%;height:min(66vh,560px)}
figcaption{display:flex;justify-content:space-between;gap:20px;margin-top:12px}
figcaption b{font-weight:400;color:var(--ink)}
.prog{height:1px;background:var(--hair);margin-top:10px}.prog i{display:block;height:1px;width:0;background:var(--ink);transition:width .8s var(--e)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}
.num{font-weight:300;font-size:56px;line-height:1;letter-spacing:-.02em}
.num small{font-size:24px;color:var(--mute)}
.nums .mono{margin-top:12px;color:var(--mute)}
.counts{margin-top:28px;color:var(--mute)}.counts b{color:var(--ink);font-weight:400}
p.fp{font-size:26px;line-height:1.55;font-weight:400;margin:28px 0 0;letter-spacing:-.005em}
p.fp span{white-space:nowrap}
p.fp.neg{font-size:20px;color:var(--mute)}p.fp.neg span{text-decoration:line-through;text-decoration-thickness:1px}
.row{display:grid;grid-template-columns:180px 1fr;gap:28px;margin-top:28px}
label.mono{display:block;color:var(--mute);margin-bottom:6px}
input,select,textarea{width:100%;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-weight:300;padding:6px 0;appearance:none;-webkit-appearance:none}
textarea{min-height:90px;resize:vertical;border:1px solid var(--hair);padding:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
button{font:12px var(--mono);background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:9px 16px;cursor:pointer;transition:all .25s var(--e)}
button:hover{background:var(--ink);color:var(--paper)}button:disabled{opacity:.35;cursor:wait}
.ba{display:grid;grid-template-columns:1fr 1fr;margin-top:44px;border-top:1px solid var(--hair)}
.ba>div{padding:20px 28px 0 0}.ba>div+div{padding:20px 0 0 28px;border-left:1px solid var(--hair)}
.sc{font-weight:300;font-size:64px;line-height:1;letter-spacing:-.02em;margin-top:12px}
.txt{margin-top:22px;font-size:18px;color:#6e6e6a;white-space:pre-wrap;outline:none}
.txt mark{background:var(--hair);color:var(--ink);font-weight:500;padding:0 1px}
.txt s{color:var(--mute);text-decoration-thickness:1px}
.hide{display:none}
.cnt{font-weight:300;font-size:56px;line-height:1;letter-spacing:-.02em}.cnt small{font-size:24px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:28px;align-items:end}
svg{width:100%;height:70px;display:block;overflow:visible}
@media(max-width:700px){.nums,.two,.ba{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:16px}.ba>div+div{border-left:0;padding-left:0;border-top:1px solid var(--hair);margin-top:20px}.ba>div{padding-right:0}.num{font-size:44px}p.fp{font-size:21px}}
@media(prefers-reduced-motion:reduce){.up{animation:none}}
</style></head><body><main>
<header class="up"><span class="mark"><span class="o"></span>Dasein</span><span class="mono mute">on this machine. nothing leaves it.</span></header>

<figure class="up" style="animation-delay:.1s">
 <div class="plate"><canvas id="cv"></canvas></div>
 <figcaption class="mono"><span><b>Fig. 1</b> &nbsp;Learning you</span><span class="mute" id="stage">idle</span></figcaption>
 <div class="prog"><i id="bar"></i></div>
 <div class="nums">
  <div><div class="num" id="m_ai">--</div><div class="mono">you vs AI</div></div>
  <div><div class="num" id="m_ot">--</div><div class="mono">you vs other people</div><div class="mono">vs bundled public writing (not your contacts)</div></div>
 </div>
 <div class="counts mono" id="counts"></div>
</figure>

<figure class="up" style="animation-delay:.2s">
 <figcaption class="mono" style="border-top:1px solid var(--hair);padding-top:12px"><span><b>Fig. 2</b> &nbsp;Your fingerprint</span><span class="mute">weight in the model, darker is stronger</span></figcaption>
 <div class="mono mute" style="margin-top:28px">sounds like you</div>
 <p class="fp" id="fp_pos"></p>
 <div class="mono mute" style="margin-top:36px">sounds like AI</div>
 <p class="fp neg" id="fp_neg"></p>
</figure>

<figure class="up" style="animation-delay:.3s">
 <figcaption class="mono" style="border-top:1px solid var(--hair);padding-top:12px"><span><b>Fig. 3</b> &nbsp;Before / after</span><span class="mute" id="gmsg"></span></figcaption>
 <div class="row">
  <div><label class="mono">to</label><select id="person"><option value="">no one</option></select></div>
  <div><label class="mono">what to write</label><input id="task" placeholder="tell him I can't make Friday, offer Monday"></div>
 </div>
 <div id="paste" class="hide" style="margin-top:24px"><label class="mono">No LLM attached. Paste texts separated by blank lines; the first is the plain-AI baseline.</label><textarea id="pastebox"></textarea></div>
 <div style="margin-top:24px"><button id="go">write it</button></div>
 <div class="ba hide" id="ba">
  <div><div class="mono mute">Plain AI</div><div class="sc" id="s_plain"></div><div class="mono mute">dasein score</div><div class="txt" id="t_plain"></div></div>
  <div><div class="mono">Dasein pick</div><div class="sc" id="s_pick"></div><div class="mono mute">dasein score</div><div class="txt" id="t_pick" contenteditable="true"></div>
   <div style="margin-top:22px"><button id="sent">I sent this</button> <span class="mono mute">edit first if you changed it</span></div></div>
 </div>
 <div class="mono mute hide" id="legend" style="margin-top:20px"><mark style="background:var(--hair);color:var(--ink);padding:0 3px">you</mark> &nbsp; <s>AI</s></div>
</figure>

<figure class="up" style="animation-delay:.4s">
 <figcaption class="mono" style="border-top:1px solid var(--hair);padding-top:12px"><span><b>Fig. 4</b> &nbsp;Self-learning</span><span class="mute">every message you send teaches it</span></figcaption>
 <div class="two">
  <div><div class="cnt"><span id="lc">0</span><small>/20</small></div><div class="mono mute" style="margin:12px 0 20px">until refit</div><button id="refit">refit now</button></div>
  <div><div class="mono mute">you vs AI, per refit</div><svg id="sp_ai"></svg><div class="mono mute" style="margin-top:22px">you vs other people, per refit</div><svg id="sp_ot"></svg></div>
 </div>
</figure>
</main>
<script>
const $=id=>document.getElementById(id);
const J=(u,b)=>fetch(u,b?{method:'POST',body:JSON.stringify(b)}:{}).then(r=>r.json());
let FP={pos:[],neg:[],hl_pos:[],hl_neg:[]},lastFit=0,busy=false,target=0,dipUntil=0,hasStatus=null;
const person=()=>$('person').value;

/* ---------- Fig. 1: ASCII bust, ported from the Dasein site's HeroBust (procedural SDF + z-buffer). p: 0 blob -> 1 bust ---------- */
const RAMP=' .,:;-=+*#%@';
const smin=(a,b,k)=>{const h=Math.max(k-Math.abs(a-b),0)/k;return Math.min(a,b)-h*h*k*.25};
const ell=(x,y,z,cx,cy,cz,rx,ry,rz)=>(Math.hypot((x-cx)/rx,(y-cy)/ry,(z-cz)/rz)-1)*Math.min(rx,ry,rz);
const cap=(x,y,z,ax,ay,az,bx,by,bz,r)=>{const px=x-ax,py=y-ay,pz=z-az,dx=bx-ax,dy=by-ay,dz=bz-az;const h=Math.max(0,Math.min(1,(px*dx+py*dy+pz*dz)/(dx*dx+dy*dy+dz*dz)));return Math.hypot(px-dx*h,py-dy*h,pz-dz*h)-r};
function bust(x,y,z){const ax=Math.abs(x);
 let d=ell(x,y,z,0,.68,-.04,.35,.4,.43);
 d=smin(d,ell(x,y,z,0,.42,.07,.27,.4,.33),.12);d=smin(d,ell(x,y,z,0,.13,.17,.12,.1,.12),.12);
 d=smin(d,ell(ax,y,z,.13,.64,.35,.14,.04,.06),.06);d=-smin(-d,ell(ax,y,z,.14,.56,.4,.075,.045,.07),.05);
 d=smin(d,ell(x,y,z,0,.44,.42,.05,.14,.11),.05);d=smin(d,ell(x,y,z,0,.27,.36,.09,.03,.05),.04);
 d=smin(d,ell(ax,y,z,.35,.5,-.03,.035,.11,.07),.04);d=smin(d,cap(x,y,z,0,.3,-.06,0,-.35,-.1,.165),.1);
 d=smin(d,cap(ax,y,z,0,-.2,-.1,.55,-.5,-.08,.13),.2);d=smin(d,ell(ax,y,z,.62,-.66,-.06,.24,.22,.24),.18);
 return smin(d,ell(x,y,z,0,-.85,-.02,.6,.45,.3),.2)}
const N=12000;
const A=new Float32Array(N*3),nA=new Float32Array(N*3),C=new Float32Array(N*3),R=new Float32Array(N*3),dl=new Float32Array(N);
(function(){let s=7;const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
 const e=.003;
 for(let i=0;i<N;){let x=rnd()*2.1-1.05,y=rnd()*2.2-1,z=rnd()*1.3-.62,gx=0,gy=0,gz=0;const d0=bust(x,y,z);if(Math.abs(d0)>.25)continue;
  if(Math.abs(d0)*2*e>.06*Math.hypot(bust(x+e,y,z)-bust(x-e,y,z),bust(x,y+e,z)-bust(x,y-e,z),bust(x,y,z+e)-bust(x,y,z-e)))continue;
  for(let k=0;k<4;k++){const d=bust(x,y,z);gx=bust(x+e,y,z)-bust(x-e,y,z);gy=bust(x,y+e,z)-bust(x,y-e,z);gz=bust(x,y,z+e)-bust(x,y,z-e);const l=Math.hypot(gx,gy,gz)||1;gx/=l;gy/=l;gz/=l;const st=d*2*e/l;x-=gx*st;y-=gy*st;z-=gz*st}
  if(y<-1)continue;
  A.set([x,y-.08,z],i*3);nA.set([gx,gy,gz],i*3);R.set([rnd()-.5,rnd()-.5,rnd()-.5],i*3);
  const yn=(y+1)/2.15,r=rnd();dl[i]=.65*(1-yn)+.35*r;i++}
 const fib=[...Array(N)].map((_,i)=>{const y=1-(2*i+1)/N,r=Math.sqrt(1-y*y),a=i*2.39996323;return[r*Math.cos(a),y,r*Math.sin(a)]});
 const band=Math.round(Math.sqrt(N)*1.2);
 const order=get=>{const ix=[...Array(N).keys()].sort((p,q)=>get(p)[1]-get(q)[1]),out=[];for(let b=0;b<N;b+=band)out.push(...ix.slice(b,b+band).sort((p,q)=>Math.atan2(get(p)[2],get(p)[0])-Math.atan2(get(q)[2],get(q)[0])));return out};
 const oa=order(i=>A.subarray(i*3,i*3+3)),of=order(i=>fib[i]);
 for(let k=0;k<N;k++){const f=fib[of[k]];C.set([f[0]*.74,f[1]*.74+.04,f[2]*.74],oa[k]*3)}})();
const ease=u=>u<=0?0:u>=1?1:u<.5?4*u*u*u:1-(-2*u+2)**3/2;
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,atlas=null,cw=5,ch=8,cols=0,rows=0,S=1,zk,lm,al,gl,hs,FR=[],CH=RAMP,pd=0,t0=performance.now();
const ink='#141414';const QP=new URLSearchParams(location.search).get('p');if(QP!==null){pd=+QP}
function atlasBuild(){ // ramp glyphs + the letters of your own top words, mapped by ink density
 const letters=[...new Set(FP.pos.slice(0,14).map(x=>x.t).join('').replace(/[^a-z']/g,''))].join('')||'etaoinshrdl';
 CH=RAMP+letters;const gw=Math.ceil(cw*dpr),c=document.createElement('canvas');c.width=gw*CH.length;c.height=Math.ceil(ch*dpr);
 const g=c.getContext('2d');g.fillStyle=ink;g.textBaseline='middle';g.textAlign='center';g.font=`${Math.round(ch*.92*dpr)}px ui-monospace,"SF Mono",Menlo,monospace`;
 for(let i=1;i<CH.length;i++)g.fillText(CH[i],i*gw+gw/2,c.height/2+dpr*.5);
 const d=g.getImageData(0,0,c.width,c.height).data,cov=[];
 for(let i=RAMP.length;i<CH.length;i++){let s=0;for(let y=0;y<c.height;y++)for(let x=i*gw;x<(i+1)*gw;x++)s+=d[(y*c.width+x)*4+3];cov.push([i,s])}
 cov.sort((a,b)=>a[1]-b[1]);FR=[0];for(let l=1;l<RAMP.length;l++)FR.push(cov[Math.round((l-1)/(RAMP.length-2)*(cov.length-1))][0]);
 atlas={c,gw,gh:c.height}}
function fit(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 S=Math.min(H/2.5,W/2.9);cw=Math.max(3,Math.min(6,S/42));ch=cw*1.55;cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
 const n=cols*rows;zk=new Float32Array(n);lm=new Float32Array(n);al=new Float32Array(n);gl=new Uint8Array(n);hs=new Float32Array(n);
 for(let q=0;q<n;q++)hs[q]=((Math.imul(q,2654435761)>>>0)/4294967296);atlasBuild()}
const proj=(x,y,z,yaw,sc,ox,oy)=>{const cy=Math.cos(yaw),sy=Math.sin(yaw),ct=Math.cos(.1),st=Math.sin(.1);const X=x*cy+z*sy;let Z=x*sy-z*cy;const Y=y*ct-Z*st;Z=y*st+Z*ct;const o=5/(Z+5);return[ox+sc*o*X,oy-sc*o*Y]};
const ANCH=[[-.3,.78,.2,-1],[-.27,.42,.28,-1],[-.35,.5,-.03,-1],[.3,.7,.2,1],[.12,.16,.3,1],[.33,-.2,.1,1]];
function draw(ms){
 const t=(ms-t0)/1000;
 const tg=QP!==null?+QP:ms<dipUntil?.38:target;pd+=(tg-pd)*(tg<pd?.08:.022);const p=pd;
 const yaw=.5*Math.sin(t*.45),cy=Math.cos(yaw),sy=Math.sin(yaw),tilt=.1,ct=Math.cos(tilt),st=Math.sin(tilt);
 const sc=S,ox=W/2,oy=H*.47,K=5;zk.fill(0);const mix=Math.max(0,Math.min(1,(p-.35)/.55))*.85;
 for(let i=0,j=0;i<N;i++,j+=3){
  const v=ease(p*1.7-dl[i]*.7),a=v,c=1-v,wob=(1-v)*.1*Math.sin(t*1.6+i*.37),sw=(1-v)*.22;
  const x=a*A[j]+c*C[j]+sw*R[j]+wob,y=a*A[j+1]+c*C[j+1]+sw*R[j+1]+wob*.7,z=a*A[j+2]+c*C[j+2]+sw*R[j+2]-wob;
  let X=x*cy+z*sy,Z=x*sy-z*cy,Y=y*ct-Z*st;Z=y*st+Z*ct;const ooz=K/(Z+K);
  const col=Math.floor((ox+sc*ooz*X)/cw),row=Math.floor((oy-sc*ooz*Y)/ch);
  let nx=a*nA[j]+c*C[j],ny=a*nA[j+1]+c*(C[j+1]-.04),nz=a*nA[j+2]+c*C[j+2];const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
  const NX=nx*cy+nz*sy,NZ0=nx*sy-nz*cy,NY=ny*ct-NZ0*st,NZ=ny*st+NZ0*ct;
  if(NZ>.12)continue;
  let alpha=1,ink2=.1+.82*(1-Math.max(0,-.5*NX+.5*NY-.7*NZ))**1.5;
  alpha*=1-a*(1-Math.max(0,Math.min(1,(A[j+1]+1.06)/.4)));
  alpha*=.45+.55*Math.min(1,p*2+.2);
  if(alpha<.02||col<0||col>=cols||row<0||row>=rows)continue;
  const q=row*cols+col;if(ooz>zk[q]){zk[q]=ooz;lm[q]=ink2;al[q]=alpha}}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const{c:img,gw,gh}=atlas,x0=(W-cols*cw)/2;
 for(let r=0,q=0;r<rows;r++)for(let c=0;c<cols;c++,q++){
  if(!zk[q]){if(c&&c<cols-1&&zk[q-1]&&zk[q+1]&&al[q-1]>.5&&al[q+1]>.5){lm[q]=lm[q-1];al[q]=al[q-1]}else continue}
  let g=Math.max(1,Math.min(RAMP.length-1,Math.round(lm[q]*(RAMP.length-1))));
  if(hs[q]<mix&&FR.length)g=FR[g];
  ctx.globalAlpha=al[q];ctx.drawImage(img,g*gw,0,gw,gh,x0+c*cw,r*ch,cw,ch)}
 ctx.globalAlpha=1;
 // plate annotations: your words, leader lines, appear once the figure has formed
 const ka=Math.max(0,(p-.85)/.15);
 if(ka>0&&FP.pos.length){ctx.globalAlpha=ka;ctx.font='11px ui-monospace,"SF Mono",Menlo,monospace';ctx.lineWidth=1;
  const side={'-1':0,'1':0};ANCH.forEach((an,k)=>{const w=FP.pos[k];if(!w)return;
   const[ax,ay]=proj(an[0],an[1],an[2],yaw,sc,ox,oy-sc*.08*0);const lx=an[3]<0?ox-sc*1.25:ox+sc*1.25,ly=H*.2+(side[an[3]]++)*H*.22;
   ctx.strokeStyle='#8d8d89';ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(ax,ay);ctx.stroke();
   ctx.fillStyle='#141414';ctx.beginPath();ctx.arc(ax,ay,2,0,6.3);ctx.fill();
   ctx.fillStyle='#8d8d89';ctx.textAlign=an[3]<0?'right':'left';ctx.fillText(`${k+1}. ${w.t}`,lx+(an[3]<0?-6:6),ly+4)});
  ctx.globalAlpha=1}
 // thinking: small ink points circling the head while candidates are written
 if(busy){const[hx,hy]=proj(0,.62,0,yaw,sc,ox,oy);for(let k=0;k<9;k++){const a=t*1.7-k*.16,r=sc*.62;
   const x=hx+Math.cos(a)*r,y=hy+Math.sin(a)*r*.3-Math.sin(a*.5)*sc*.04;ctx.globalAlpha=Math.max(0,1-k*.11);ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x,y,k?1.6:2.6,0,6.3);ctx.fill()}ctx.globalAlpha=1}
 requestAnimationFrame(draw)}
addEventListener('resize',fit);fit();requestAnimationFrame(draw);

/* ---------- state ---------- */
const STAGES={reading:'reading',learning:'learning',evaluating:'evaluating',done:'done',error:'error',none:'idle'};
const pct=x=>x==null?'--':`${(x*100).toFixed(1)}<small>%</small>`;
function spark(el,h,k){const v=h.map(x=>x[k]).filter(x=>x!=null),s=$(el);if(!v.length){s.innerHTML='';return}
 const lo=Math.min(...v)-.01,hi=Math.max(...v)+.01,Wd=300,Ht=70;
 const pts=v.map((y,i)=>[v.length==1?10:i*(Wd-24)/(v.length-1)+10,Ht-10-(y-lo)/(hi-lo||1)*(Ht-30)]);
 s.setAttribute('viewBox',`0 0 ${Wd} ${Ht}`);
 s.innerHTML=`<line x1="0" x2="${Wd}" y1="${Ht-1}" y2="${Ht-1}" stroke="#e4e4e0"/><polyline fill="none" stroke="#141414" stroke-width="1" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#141414"/><text x="${p[0]}" y="${p[1]-8}" fill="#8d8d89" font-size="10" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">${(v[i]*100).toFixed(1)}</text>`).join('')}
async function poll(){
 const s=await J('/api/status');
 const m=s.metrics||{};
 let tg=0;if(s.has_model&&s.stage!='error')tg=s.stage=='done'||s.stage=='none'?1:({reading:.2,learning:.4,evaluating:.8}[s.stage]??1);
 if(hasStatus!==null&&s.updated!==hasStatus&&s.stage=='done'){dipUntil=performance.now()+1900} // refit: blur, then sharpen
 hasStatus=s.updated;target=tg;
 $('stage').textContent=STAGES[s.stage]||s.stage;$('bar').style.width=(s.progress||0)*100+'%';
 $('counts').innerHTML=s.mine!=null?`<b>${s.mine}</b> your texts &nbsp;/&nbsp; <b>${s.others??'-'}</b> other people's &nbsp;/&nbsp; <b>${s.ai??'-'}</b> AI`:'';
 $('m_ai').innerHTML=pct(m.ai&&m.ai.acc);$('m_ot').innerHTML=pct(m.others&&m.others.acc);
 $('lc').textContent=s.learn_count;spark('sp_ai',s.history,'ai');spark('sp_ot',s.history,'others');
 $('paste').classList.toggle('hide',s.llm);$('go').textContent=s.llm?'write it':'score these';
 if(s.stage=='done'&&s.updated!=lastFit){lastFit=s.updated;loadFP()}}
function words(el,a,neg){const mx=Math.max(...a.map(x=>Math.abs(x.w)),1e-9);
 $(el).innerHTML=a.map(x=>{const o=neg?1:.45+.55*Math.abs(x.w)/mx;return `<span style="opacity:${o};font-weight:${neg?400:Math.abs(x.w)/mx>.7?500:400}">${x.t.replace(/</g,'&lt;')}</span>`}).join(neg?', ':' · ')||'<span class="mute">after the first fit</span>'}
async function loadFP(){FP=await J('/api/fingerprint');words('fp_pos',FP.pos,false);words('fp_neg',FP.neg,true);atlasBuild()}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(text){const lo=text.toLowerCase(),tag=new Array(text.length).fill(0);
 const all=[...FP.hl_pos.map(t=>[t,1]),...FP.hl_neg.map(t=>[t,2])].sort((a,b)=>b[0].length-a[0].length);
 for(const[t,k]of all){let i=-1;while((i=lo.indexOf(t,i+1))>=0){const b=(i==0||!/\w/.test(lo[i-1]))&&(i+t.length>=lo.length||!/\w/.test(lo[i+t.length]));if(b&&tag.slice(i,i+t.length).every(x=>!x))tag.fill(k,i,i+t.length)}}
 let o='',cur=0,buf='';const fl=()=>{if(buf)o+=cur==1?`<mark>${esc(buf)}</mark>`:cur==2?`<s>${esc(buf)}</s>`:esc(buf);buf=''};
 for(let i=0;i<text.length;i++){if(tag[i]!=cur){fl();cur=tag[i]}buf+=text[i]}fl();return o}
async function people(){const p=await J('/api/people');$('person').innerHTML='<option value="">no one</option>'+p.map(x=>`<option>${x}</option>`).join('')}
$('go').onclick=async()=>{
 $('go').disabled=true;busy=true;$('gmsg').textContent='writing 7 drafts, scoring each';
 let r;try{const st=await J('/api/status');
  r=st.llm?await J('/api/generate',{person:person(),task:$('task').value}):await J('/api/score',{texts:$('pastebox').value.split(/\n\s*\n/)})}catch(e){r={error:String(e)}}
 $('go').disabled=false;busy=false;
 if(r.error){$('gmsg').textContent=r.error;return}
 $('gmsg').textContent=`best of ${r.all.length}`;
 for(const k of['plain','pick']){$('s_'+k).textContent=r[k].score;$('t_'+k).innerHTML=hl(r[k].text)}
 const b=$('ba');b.classList.remove('hide');$('legend').classList.remove('hide');b.style.animation='none';b.offsetWidth;b.style.animation='up 1s var(--e) both'};
$('sent').onclick=async()=>{const r=await J('/api/learn',{text:$('t_pick').innerText,person:person()});$('lc').textContent=r.learn_count;$('sent').textContent='learned';setTimeout(()=>$('sent').textContent='I sent this',1500);poll()};
$('refit').onclick=async()=>{dipUntil=performance.now()+1900;await J('/api/refit',{});poll()};
people();loadFP();poll();setInterval(poll,1000);
</script></body></html>
